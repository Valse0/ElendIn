name: Android APK

# Builds the web app, wraps it with Capacitor and produces an APK.
#   * Always builds a DEBUG apk (installable for testing; signed with the auto-generated debug key).
#   * Builds a signed RELEASE apk only if all four signing secrets exist (see README → "Android APK").
#   * On a tag like v0.1.0 the apk files are also attached to a GitHub Release.
# No keystore is stored in this repository and none is ever generated here.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed only to create the GitHub Release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7 requires JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tests
        run: npm test

      - name: Build web app
        run: npm run build

      # The android/ project is generated, not committed (see .gitignore), so it always matches the installed Capacitor version.
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set version (name from VERSION, code from the run number)
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE"
          grep -nE "versionCode|versionName" "$GRADLE"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (unsigned)
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Align and sign release APK
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -n1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/ElendIn-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/ElendIn-release.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ElendIn-debug.apk
          if [ -f "$RUNNER_TEMP/ElendIn-release.apk" ]; then cp "$RUNNER_TEMP/ElendIn-release.apk" out/; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ElendIn-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
